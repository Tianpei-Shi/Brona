# 编译检查；推送 v* 标签时自动打包并发布 Release
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 校验语言文件
        shell: pwsh
        run: |
          $en = Get-Content src/Brona/Strings/en.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($f in Get-ChildItem src/Brona/Strings/*.json) {
            $m = Get-Content $f -Raw | ConvertFrom-Json -AsHashtable
            $extra = $m.Keys | Where-Object { -not $en.ContainsKey($_) }
            if ($extra) { throw "$($f.Name) 含有未知的键：$($extra -join ', ')" }
          }

      - name: 发布
        run: dotnet publish src/Brona/Brona.csproj -c Release -o dist

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Brona-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Brona-win-x64
          path: Brona-win-x64.zip

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Brona-win-x64.zip
          generate_release_notes: true
